[package]
name = "gravityfile-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal user interface for gravityfile"

[dependencies]
gravityfile-core.workspace = true
gravityfile-scan.workspace = true
gravityfile-analyze.workspace = true
gravityfile-ops.workspace = true
gravityfile-plugin.workspace = true
ratatui.workspace = true
crossterm.workspace = true
color-eyre.workspace = true
tokio.workspace = true
tokio-util = { workspace = true }
humansize.workspace = true
chrono.workspace = true
strum.workspace = true
tracing.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1"
which = "8"

# Fuzzy search
nucleo = "0.5"
regex = "1"

# File preview / syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

# Terminal image previews (sixel / kitty / iTerm2, with a halfblocks fallback)
# Keep image/default codecs disabled; enable only the formats we preview below.
# Dependency changes must continue to pass the Rust 1.90 and supply-chain gates.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "qoi", "pnm", "tga"] }

# Path utilities
dirs = "7"

# Settings persistence
serde.workspace = true
toml = "1"

# File opening in editors
opensesame = { version = "0.1", features = ["serde"] }

# System open command (for non-editor files)
open = "5"

# PTY buffer flush on quit (unix only)
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Safe deletion (move to trash instead of permanent delete)
trash.workspace = true

# Archive support for preview
zip.workspace = true
tar.workspace = true
flate2.workspace = true
xz2.workspace = true
bzip2.workspace = true
serde_json.workspace = true

tempfile.workspace = true
