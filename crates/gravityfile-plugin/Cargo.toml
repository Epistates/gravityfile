tracing-subscriber.workspace = true

mlua = { version = "0.12", features = ["lua54", "async", "serialize", "send", "vendored"] }
toml = "1"
dirs = "7"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
