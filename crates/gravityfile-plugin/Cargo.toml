[package]
name = "gravityfile-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Language-agnostic plugin system for gravityfile"

[dependencies]
indexmap.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Plugin runtimes
mlua = { version = "0.12", features = ["lua54", "async", "serialize", "send", "vendored"] }
rhai = { version = "1.26", features = ["sync", "serde"] }

# Configuration
toml = "1"
dirs = "7"

# Composable middleware for the hook-dispatch pipeline
tower = { version = "0.5", features = ["timeout", "util"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
