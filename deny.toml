[graph]
all-features = true

[advisories]
ignore = [
    # Scope these exceptions to the qualified lockfile, not claims that an
    # upstream version is permanently latest or migration is impossible.
    { id = "RUSTSEC-2025-0141", reason = "Locked syntect 5.3.0 uses bincode 1.3.3 for syntax/theme dumps; removal has not been qualified" },
    { id = "RUSTSEC-2026-0249", reason = "Locked rhai 1.26.1 depends on smartstring; dependency replacement has not been qualified" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

# Updated Zstandard bindings use BSD-3-Clause; retain notice and disclaimer
# obligations. Scope allowances to these dependencies rather than all crates.
[[licenses.exceptions]]
name = "zstd-safe"
version = "=7.3.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-sys"
version = "=2.1.0"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
