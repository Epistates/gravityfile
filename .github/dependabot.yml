version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # An action runs in CI, with the repository's tokens, as soon as its
    # update merges, so a new release waits a week before it is proposed.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
