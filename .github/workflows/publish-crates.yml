# Publishes every workspace crate to crates.io with Trusted Publishing.
#
# release.yml (generated by dist) calls this after the GitHub release is
# hosted. crates.io matches the calling workflow, so each crate's trusted
# publisher on crates.io names `release.yml`, not this file. There is no
# long-lived token: the auth action swaps the job's GitHub OIDC token for a
# short-lived crates.io token and revokes it when the job ends. If crates.io
# rejects the exchange or any publish, this job fails and the release run
# goes red.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan, as JSON (required by dist, unused here)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
