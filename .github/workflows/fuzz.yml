name: Fuzz

# Pull requests touching the readers get a short run; the weekly run goes
# longer and keeps its corpus between runs.
on:
  pull_request:
    paths:
      - crates/gravityfile-core/**
      - crates/gravityfile-scan/**
      - fuzz/**
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [snapshot, units]
    env:
      SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && 60 || 1200 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }} seeds/${{ matrix.target }}
          # The prebuilt cargo-fuzz is a static musl binary and would build
          # for musl, where the address sanitizer cannot work.
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo fuzz run --target "$host" ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_TO_RUN" -rss_limit_mb=2048
      - name: Save corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
