name: Release-plz

# On every push to main: keep a release pull request up to date, and publish
# whatever a merged release pull request bumped. See release-plz.toml.
#
# Needs a RELEASE_PLZ_TOKEN secret (a fine-grained token with contents and
# pull-requests write access): tags and pull requests made with the default
# GITHUB_TOKEN do not start other workflows, so the release tag would never
# reach release.yml and CI would never run on the release pull request.
# Crates are published with crates.io trusted publishing, configured for
# this workflow on each crate's crates.io settings page.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish
    if: github.repository_owner == 'epistates'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # crates.io trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  pull-request:
    name: Release pull request
    if: github.repository_owner == 'epistates'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
