name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test release artifact validation
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint optional-feature boundaries
        run: cargo clippy -p gravityfile-scan --all-targets --no-default-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify packaged sources
        timeout-minutes: 30
        run: |
          cargo fetch --locked
          cargo package --workspace --allow-dirty --no-verify --locked --offline
          python3 scripts/verify-packaged-workspace.py

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny,cargo-machete

      - name: Advisories, licenses, sources and bans
        run: cargo deny check

      - name: Unused dependencies
        run: cargo machete

  build:
    name: Build for ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          shared-key: ${{ matrix.target }}

      - name: Install notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate dependency notices
        run: python3 scripts/generate-notices.py --target ${{ matrix.target }} --output THIRD_PARTY_NOTICES.html

      # Install cross for Linux ARM builds
      # Using cargo install from git since there are no recent releases
      # (last release v0.2.5 was in Feb 2023, but development is active)
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8633ec65ab914015c2444c732568b414bd3c47cf

      # For Linux ARM, we need proper configuration
      - name: Create .cargo/config.toml for Linux ARM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          ar = "aarch64-linux-gnu-ar"
          EOF

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Smoke-test built CLI binaries
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: python3 scripts/smoke-release.py --binary-dir "target/${{ matrix.target }}/release"

      - name: Smoke-test native Unix terminal behavior
        if: ${{ !matrix.use_cross && runner.os != 'Windows' }}
        shell: bash
        run: |
          python3 scripts/qualification/terminal-smoke.py "target/${{ matrix.target }}/release/grav"
          python3 scripts/qualification/terminal-smoke.py "target/${{ matrix.target }}/release/gravityfile"

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mode="$(python3 scripts/check-signing-config.py)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Import Apple Code Signing Certificate
        if: runner.os == 'macOS' && steps.signing.outputs.mode == 'developer-id'
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Code sign and notarize macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "$SIGNING_MODE" = developer-id || test "$SIGNING_MODE" = adhoc

          # Sign both binaries
          for BINARY in gravityfile grav; do
            BINARY_PATH="target/${{ matrix.target }}/release/$BINARY"

            if [ "$SIGNING_MODE" = "developer-id" ]; then
              echo "Signing $BINARY with Developer ID..."
              codesign --deep --force --verify --verbose \
                --timestamp --options runtime \
                --sign "$APPLE_DEVELOPER_ID" \
                "$BINARY_PATH"
              codesign -v "$BINARY_PATH"

              echo "Notarizing $BINARY with Apple..."
              ditto -c -k --sequesterRsrc "$BINARY_PATH" "${BINARY}-notarize.zip"

              xcrun notarytool submit "${BINARY}-notarize.zip" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait \
                --timeout 30m \
                --output-format json > "${BINARY}-notarization.json"
              python3 scripts/verify-notarization.py "${BINARY}-notarization.json"

              echo "Note: Stapling is not applicable to bare CLI binaries"
              echo "Gatekeeper diagnostic (not a release acceptance check)..."
              spctl -a -v "$BINARY_PATH" || true
              echo "✓ $BINARY signed and notarized"
            else
              echo "Developer ID certificate not configured. Using ad-hoc signing for $BINARY..."
              codesign --remove-signature "$BINARY_PATH" || true
              codesign -s - "$BINARY_PATH"
              codesign -v "$BINARY_PATH"
              echo "⚠ $BINARY ad-hoc signed (users may see Gatekeeper warning)"
            fi
          done


      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          # Create artifacts directory
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $archiveName = "gravityfile-${{ matrix.target }}"

          # Create a directory for the archive contents
          New-Item -ItemType Directory -Force -Path $archiveName | Out-Null

          # Copy both binaries
          Copy-Item "target/${{ matrix.target }}/release/gravityfile.exe" "$archiveName/"
          Copy-Item "target/${{ matrix.target }}/release/grav.exe" "$archiveName/"
          Copy-Item "LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.html" "$archiveName/"

          # Create zip for Windows (tar.gz not common on Windows)
          Compress-Archive -Path $archiveName -DestinationPath "artifacts/$archiveName.zip"

          # Generate SHA256 for the archive
          $hash = (Get-FileHash "artifacts/$archiveName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName.zip" | Out-File -FilePath "artifacts/$archiveName.zip.sha256" -Encoding ascii -NoNewline

          Write-Host "Archive contents:"
          Get-ChildItem $archiveName | Format-List Name, Length
          Write-Host "SHA256:"
          Get-Content "artifacts/$archiveName.zip.sha256"
        shell: pwsh

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          ARCHIVE_NAME="gravityfile-${{ matrix.target }}"

          # Create a directory for the archive contents
          mkdir -p "$ARCHIVE_NAME"

          # Copy both binaries
          cp "target/${{ matrix.target }}/release/gravityfile" "$ARCHIVE_NAME/"
          cp "target/${{ matrix.target }}/release/grav" "$ARCHIVE_NAME/"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.html "$ARCHIVE_NAME/"
          chmod +x "$ARCHIVE_NAME/gravityfile" "$ARCHIVE_NAME/grav"

          # Preserve executable permissions without macOS AppleDouble sidecars.
          COPYFILE_DISABLE=1 tar -czf "artifacts/$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"

          # Generate SHA256 for the archive
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"
          fi

          echo "Archive contents:"
          tar -tzf "$ARCHIVE_NAME.tar.gz"
          echo "SHA256:"
          cat "$ARCHIVE_NAME.tar.gz.sha256"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Verify and prepare release assets
        run: python3 scripts/verify-release.py release-artifacts final-release

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            final-release/*.tar.gz
            final-release/*.zip
            final-release/*.sha256
            final-release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
