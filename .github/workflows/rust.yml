name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --no-default-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked --no-fail-fast
      - run: cargo test --workspace --all-features --locked --doc

      - name: Shell integration (bash, zsh, fish)
        if: runner.os == 'Linux'
        env:
          GRAVITYFILE_REQUIRE_SHELLS: '1'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
          cargo build --bins --locked
          python3 -m unittest discover -s scripts -p test_shell_integration.py

      - name: ncdu dump compatibility
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends ncdu jq
          cargo build --bins --locked
          scripts/ncdu-interop.sh target/debug/grav

      - name: Terminal startup and restoration
        if: runner.os != 'Windows'
        run: |
          cargo build --bins --locked
          python3 scripts/terminal-smoke.py target/debug/grav

  musl:
    name: Static Linux build (musl)
    # The image dist builds the static release binary on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # Linking is what differs: musl lacks some glibc wrappers.
      - run: cargo build --locked --target x86_64-unknown-linux-musl --bin grav
      - run: target/x86_64-unknown-linux-musl/debug/grav scan --top 3 .
      - run: cargo test --locked --target x86_64-unknown-linux-musl -p gravityfile-ops

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: ''

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Measure
        run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Summarize
        run: |
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only | awk 'NR == 1 || /^TOTAL/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  semver:
    name: Semver compatibility of the library crates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: semver
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-semver-checks
      # Against the latest release on crates.io: a breaking change needs a
      # version bump that says so. The gravityfile package is the binary;
      # its library only shares code with the tests.
      - run: cargo semver-checks --workspace --exclude gravityfile

  supply-chain:
    name: Advisories, licenses and unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete
